<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PixelFlow">
  <title>PixelFlow</title>
  <!-- The mark is the app's own language: a pixel-art timer face with a flowing
       pixel trail. Drawn on an 8px grid so it stays crisp at favicon size, and
       kept to a handful of flat colours so it survives a single-colour favicon
       rasteriser. -->
  <rect width="64" height="64" rx="12" fill="#0f0f16"/>
  <!-- Pixel trail: the "flow" half of the name. -->
  <g fill="#6bffda">
    <rect x="8"  y="44" width="6" height="6" opacity=".95"/>
    <rect x="16" y="48" width="6" height="6" opacity=".7"/>
    <rect x="24" y="51" width="5" height="5" opacity=".45"/>
  </g>
  <!-- Timer face. -->
  <rect x="18" y="10" width="28" height="30" rx="6" fill="#7c6fff"/>
  <rect x="27" y="5"  width="10" height="5" rx="2" fill="#7c6fff"/>
  <rect x="26" y="40" width="12" height="4" rx="2" fill="#7c6fff"/>
  <!-- Dial marks. -->
  <g fill="#0f0f16">
    <rect x="24" y="14" width="4" height="4"/>
    <rect x="36" y="14" width="4" height="4"/>
    <rect x="23" y="23" width="5" height="5" opacity=".5"/>
    <rect x="36" y="23" width="5" height="5" opacity=".5"/>
  </g>
  <!-- Hands: the pixel-art tell. -->
  <rect x="30" y="18" width="4" height="10" fill="#0f0f16"/>
  <rect x="30" y="24" width="9" height="4" fill="#0f0f16"/>
  <rect x="31" y="25" width="6" height="2" fill="#6bffda"/>
</svg>
